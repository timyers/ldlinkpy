[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ldlinkpy"
version = "0.4.5"
description = "Official Python client for the NIH LDlink REST API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
  { name = "Timothy A. Myers" },
  { name = "Stephen J. Chanock" },
  { name = "Mitchel J. Machiela" },
]
dependencies = [
  "requests>=2.31",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "responses>=0.25",
  "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/machiela-lab/LDlinkPy"
Repository = "https://github.com/machiela-lab/LDlinkPy"
Documentation = "https://github.com/machiela-lab/LDlinkPy/tree/main/docs"
Issues = "https://github.com/machiela-lab/LDlinkPy/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ldlinkpy*"]

[tool.setuptools.package-data]
ldlinkpy = ["data/*.csv"]

[tool.ruff]
line-length = 88
target-version = "py310"
fix = false

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"ldlinkpy/__init__.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"
