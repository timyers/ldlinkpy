name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            experimental: false
          - os: ubuntu-latest
            python-version: "3.11"
            experimental: false
          - os: ubuntu-latest
            python-version: "3.12"
            experimental: false
          - os: windows-latest
            python-version: "3.12"
            experimental: true
          - os: macos-latest
            python-version: "3.12"
            experimental: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run lint checks
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest
